<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    async function expectDataError(label, algorithm, usages, jwk) {
        try {
            await crypto.subtle.importKey("jwk", jwk, algorithm, false, usages);
            println(`${label}: accepted`);
        } catch (error) {
            println(`${label}: ${error.name}`);
        }
    }

    asyncTest(async done => {
        const incompleteCrtJwk = {
            kty: "RSA",
            n: "AA",
            e: "AA",
            d: "AA",
            p: "AA",
        };

        await expectDataError("RSA-OAEP incomplete CRT", { name: "RSA-OAEP", hash: "SHA-256" }, ["decrypt"], incompleteCrtJwk);
        await expectDataError("RSA-PSS incomplete CRT", { name: "RSA-PSS", hash: "SHA-256" }, ["sign"], incompleteCrtJwk);
        await expectDataError("RSASSA-PKCS1-v1_5 incomplete CRT", { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, ["sign"], incompleteCrtJwk);
        done();
    });
</script>
