<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    test(() => {
        const canvas = new OffscreenCanvas(2, 2);
        const gl = canvas.getContext("webgl");
        println(gl !== null);
        println(gl.canvas === canvas);

        gl.clearColor(1, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const snapshot = canvas.transferToImageBitmap();
        println(`${snapshot.width},${snapshot.height}`);

        // A transfer snapshot must not alias the drawing buffer which remains
        // active through RinGL after the transfer.
        gl.clearColor(0, 1, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);

        const destination = new OffscreenCanvas(2, 2);
        const context = destination.getContext("2d");
        context.drawImage(snapshot, 0, 0);
        println(Array.from(context.getImageData(0, 0, 1, 1).data).join(","));

        // A zero logical dimension must not make the RinGL context factory
        // expose its internal 1x1 allocation or fail creation.
        const zero_width_canvas = new OffscreenCanvas(0, 3);
        const zero_width_gl = zero_width_canvas.getContext("webgl");
        println(zero_width_gl !== null);
        println(`${zero_width_gl.drawingBufferWidth},${zero_width_gl.drawingBufferHeight}`);
    });
</script>
