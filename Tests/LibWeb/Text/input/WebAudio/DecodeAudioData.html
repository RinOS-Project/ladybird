<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const context = new OfflineAudioContext(1, 128, 44100);
        const bytes = new Uint8Array(46);
        const view = new DataView(bytes.buffer);
        const text = (offset, value) => [...value].forEach((character, index) => bytes[offset + index] = character.charCodeAt(0));
        text(0, "RIFF");
        view.setUint32(4, 38, true);
        text(8, "WAVE");
        text(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, 44100, true);
        view.setUint32(28, 88200, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        text(36, "data");
        view.setUint32(40, 2, true);
        view.setInt16(44, 16384, true);
        const buffer = await context.decodeAudioData(bytes.buffer);
        println(`decoded: ${buffer.numberOfChannels},${buffer.length},${buffer.sampleRate},${buffer.getChannelData(0)[0]}`);
        try {
            await context.decodeAudioData(new Uint8Array([1, 2, 3]).buffer);
            println("FAIL: invalid data decoded");
        } catch (error) {
            println(`invalid: ${error.name}`);
        }
        done();
    });
</script>
