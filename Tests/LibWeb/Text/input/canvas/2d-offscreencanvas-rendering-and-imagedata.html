<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    test(() => {
        const opaque_canvas = new OffscreenCanvas(1, 1);
        const opaque_context = opaque_canvas.getContext("2d", { alpha: false });
        println(Array.from(opaque_context.getImageData(0, 0, 1, 1).data).join(","));
        opaque_canvas.transferToImageBitmap();
        println(Array.from(opaque_context.getImageData(0, 0, 1, 1).data).join(","));

        const canvas = new OffscreenCanvas(4, 4);
        const context = canvas.getContext("2d");

        println(context.globalCompositeOperation);
        context.globalCompositeOperation = "copy";
        println(context.globalCompositeOperation);
        context.fillStyle = "red";
        context.fillRect(0, 0, 4, 4);
        println(Array.from(context.getImageData(0, 0, 1, 1).data).join(","));

        context.clearRect(0, 0, 1, 1);
        println(Array.from(context.getImageData(0, 0, 1, 1).data).join(","));

        context.beginPath();
        context.rect(1, 1, 2, 2);
        println(`${context.isPointInPath(2, 2)},${context.isPointInPath(0, 0)}`);

        const image_data = context.createImageData(1, 1);
        image_data.data.set([0, 0, 255, 255]);
        context.putImageData(image_data, 3, 3);
        println(Array.from(context.getImageData(3, 3, 1, 1).data).join(","));

        canvas.width = canvas.width;
        println(Array.from(context.getImageData(3, 3, 1, 1).data).join(","));

        const text_canvas = new OffscreenCanvas(32, 16);
        const text_context = text_canvas.getContext("2d");
        println(text_context.measureText("M").width > 0);
        text_context.fillStyle = "red";
        text_context.fillText("M", 0, 12);
        println(Array.from(text_context.getImageData(0, 0, 32, 16).data).some(value => value > 0));
        text_context.clearRect(0, 0, 32, 16);
        text_context.strokeText("M", 0, 12);
        println(Array.from(text_context.getImageData(0, 0, 32, 16).data).some(value => value > 0));

        const filter_canvas = new OffscreenCanvas(1, 1);
        const filter_context = filter_canvas.getContext("2d");
        filter_context.filter = "brightness(0%)";
        println(filter_context.filter);
        filter_context.fillStyle = "red";
        filter_context.fillRect(0, 0, 1, 1);
        println(Array.from(filter_context.getImageData(0, 0, 1, 1).data).join(","));
        filter_context.filter = "url(#unavailable)";
        println(filter_context.filter);
    });
</script>
