<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    test(() => {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl");
        if (!gl) {
            println("SKIP: WebGL backend is unavailable");
            return;
        }

        const vertex = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertex, "attribute vec2 position; varying vec2 uv; void main() { uv = position; gl_Position = vec4(position, 0.0, 1.0); }");
        gl.compileShader(vertex);

        const fragment = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragment, "precision mediump float; varying vec2 uv; uniform sampler2D palette[2]; void main() { gl_FragColor = texture2D(palette[1], uv); }");
        gl.compileShader(fragment);

        const program = gl.createProgram();
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        gl.useProgram(program);

        const base = gl.getUniformLocation(program, "palette");
        const second = gl.getUniformLocation(program, "palette[1]");
        gl.uniform1iv(base, new Int32Array([2, 5]));
        println(`second array location: ${second !== null}`);
        println(`second array value: ${gl.getUniform(program, second)}`);
        println(`error: ${gl.getError()}`);
    });
</script>
