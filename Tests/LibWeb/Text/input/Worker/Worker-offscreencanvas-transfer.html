<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(done => {
        const workerScript = `
            self.onmessage = function(event) {
                try {
                    const canvas = event.data.canvas;
                    const zeroSizedCanvas = event.data.zeroSizedCanvas;
                    const context = canvas.getContext("2d");
                    const pixel = context.getImageData(0, 0, 1, 1).data;
                    self.postMessage(JSON.stringify({
                        receiverDimensions: [canvas.width, canvas.height],
                        receiverPixel: [pixel[0], pixel[1], pixel[2], pixel[3]],
                        zeroDimensionTransfer: [zeroSizedCanvas.width, zeroSizedCanvas.height],
                    }));
                } catch (error) {
                    self.postMessage("Error: " + error);
                }
            };
        `;

        const worker = new Worker(URL.createObjectURL(new Blob([workerScript], { type: "application/javascript" })));
        worker.onmessage = event => {
            println("Worker transfer result: " + event.data);
            done();
        };

        const contextBackedCanvas = new OffscreenCanvas(2, 2);
        contextBackedCanvas.getContext("2d");
        let contextTransferThrows = false;
        try {
            worker.postMessage(contextBackedCanvas, [contextBackedCanvas]);
        } catch (error) {
            contextTransferThrows = error.name === "InvalidStateError";
        }
        println("Context-backed transfer rejected: " + JSON.stringify({
            width: contextBackedCanvas.width,
            height: contextBackedCanvas.height,
            contextTransferThrows,
        }));

        const canvas = new OffscreenCanvas(2, 2);
        const zeroSizedCanvas = new OffscreenCanvas(0, 3);
        worker.postMessage({ canvas, zeroSizedCanvas }, [canvas, zeroSizedCanvas]);
        let detachedGetContextThrows = false;
        try {
            canvas.getContext("2d");
        } catch (error) {
            detachedGetContextThrows = error.name === "InvalidStateError";
        }
        println("Sender detached: " + JSON.stringify({ width: canvas.width, height: canvas.height, detachedGetContextThrows }));
    });
</script>
